name: SentinelAI Docker Build & OCI Container Registry Publishing

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: DOCKER IMAGE BUILD, VULNERABILITY SCAN & REGISTRY PUBLISHING
  # =========================================================================
  build-and-publish:
    name: Build Multi-Stage Docker Images & Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ingestion-collector
          - ocsf-normalizer
          - causal-graph
          - story-aggregator
          - ai-supervisor
          - xai-lineage
          - policy-guardrail
          - action-orchestrator
          - copilot-service
          - audit-governance
          - executive-analytics
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Derive Lowercase Repository Reference
        run: |
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Microservice Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.service
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          push: false
          tags: ${{ env.IMAGE_REPO }}/${{ matrix.service }}:${{ github.sha }}
          load: true

      - name: Run Trivy Container Image Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.IMAGE_REPO }}/${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Container Image to Registry (Main Only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.IMAGE_REPO }}/${{ matrix.service }}:${{ github.sha }}
