name: SentinelAI Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: LINT & FORMAT CHECK
  # =========================================================================
  lint:
    name: Lint & Code Style Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.4

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint Verification
        run: pnpm run lint

      - name: Run Prettier Formatting Check
        run: pnpm run format:check

  # =========================================================================
  # JOB 2: PROTO CODEGEN & TYPE-CHECK
  # =========================================================================
  typecheck:
    name: Proto Codegen & Strict TypeScript Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.4

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Code Generation Pipeline
        run: pnpm run codegen

      - name: Execute Strict Type Checking
        run: pnpm run typecheck

  # =========================================================================
  # JOB 3: UNIT TESTS & COVERAGE REPORTING
  # =========================================================================
  unit-tests:
    name: Unit Tests & Code Coverage
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.4

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Unit Test Suite with Coverage
        run: pnpm run test:cov

      - name: Upload Code Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/

  # =========================================================================
  # JOB 4: PROTOCOL BUFFER CONTRACT COMPATIBILITY TESTS
  # =========================================================================
  contract-tests:
    name: gRPC Proto Contract Compatibility Tests
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.4

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run gRPC Backward Compatibility Contract Verification
        run: pnpm --filter=@sentinelai/proto test
