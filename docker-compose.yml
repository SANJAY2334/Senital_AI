version: '3.8'

# SentinelAI Local Development & Integration Orchestration
# Satisfies HLD Section 14, ADR-0004 (Event-Driven Bus), ADR-0007 (Polyglot Storage), ADR-0016 (Containers)

networks:
  sentinelai-network:
    driver: bridge
    name: sentinelai-network

volumes:
  zookeeper-data:
    driver: local
  kafka-data:
    driver: local
  redis-graph-data:
    driver: local
  minio-lakehouse-data:
    driver: local

services:
  # =========================================================================
  # 1. INFRASTRUCTURE SUBSTRATE (Zookeeper, Kafka, Redis, MinIO, OTEL)
  # =========================================================================
  zookeeper:
    image: bitnami/zookeeper:3.9.1
    container_name: sentinelai-zookeeper
    networks:
      - sentinelai-network
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - zookeeper-data:/bitnami/zookeeper
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.6.1
    container_name: sentinelai-kafka
    networks:
      - sentinelai-network
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka-data:/bitnami/kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis-graph:
    image: redis:7.2-alpine
    container_name: sentinelai-redis-graph
    networks:
      - sentinelai-network
    ports:
      - "6379:6379"
    volumes:
      - redis-graph-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-lakehouse:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: sentinelai-minio-lakehouse
    networks:
      - sentinelai-network
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=sentinelai-admin
      - MINIO_ROOT_PASSWORD=sentinelai-secret-key
    volumes:
      - minio-lakehouse-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.93.0
    container_name: sentinelai-otel-collector
    networks:
      - sentinelai-network
    ports:
      - "4317:4317" # OTLP gRPC
      - "8888:8888" # Metrics
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4317"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =========================================================================
  # 2. MICROSERVICE BACKENDS (11 Core Microservices)
  # =========================================================================
  ingestion-collector:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: ingestion-collector
    container_name: sentinelai-ingestion-collector
    networks:
      - sentinelai-network
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - KAFKA_BROKERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ocsf-normalizer:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: ocsf-normalizer
    container_name: sentinelai-ocsf-normalizer
    networks:
      - sentinelai-network
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
      - PORT=8081
      - KAFKA_BROKERS=kafka:9092
      - LAKEHOUSE_ENDPOINT=http://minio-lakehouse:9000
    depends_on:
      kafka:
        condition: service_healthy
      minio-lakehouse:
        condition: service_healthy

  causal-graph:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: causal-graph
    container_name: sentinelai-causal-graph
    networks:
      - sentinelai-network
    ports:
      - "8082:8082"
    environment:
      - NODE_ENV=development
      - PORT=8082
      - REDIS_GRAPH_ENDPOINT=redis-graph:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      redis-graph:
        condition: service_healthy
      kafka:
        condition: service_healthy

  story-aggregator:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: story-aggregator
    container_name: sentinelai-story-aggregator
    networks:
      - sentinelai-network
    ports:
      - "8083:8083"
    environment:
      - NODE_ENV=development
      - PORT=8083
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  ai-supervisor:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: ai-supervisor
    container_name: sentinelai-ai-supervisor
    networks:
      - sentinelai-network
    ports:
      - "8084:8084"
    environment:
      - NODE_ENV=development
      - PORT=8084
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  xai-lineage:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: xai-lineage
    container_name: sentinelai-xai-lineage
    networks:
      - sentinelai-network
    ports:
      - "8085:8085"
    environment:
      - NODE_ENV=development
      - PORT=8085
      - LAKEHOUSE_ENDPOINT=http://minio-lakehouse:9000
    depends_on:
      minio-lakehouse:
        condition: service_healthy

  policy-guardrail:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: policy-guardrail
    container_name: sentinelai-policy-guardrail
    networks:
      - sentinelai-network
    ports:
      - "8086:8086"
    environment:
      - NODE_ENV=development
      - PORT=8086

  action-orchestrator:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: action-orchestrator
    container_name: sentinelai-action-orchestrator
    networks:
      - sentinelai-network
    ports:
      - "8087:8087"
    environment:
      - NODE_ENV=development
      - PORT=8087
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  copilot-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: copilot-service
    container_name: sentinelai-copilot-service
    networks:
      - sentinelai-network
    ports:
      - "8088:8088"
    environment:
      - NODE_ENV=development
      - PORT=8088
      - REDIS_GRAPH_ENDPOINT=redis-graph:6379
    depends_on:
      redis-graph:
        condition: service_healthy

  audit-governance:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: audit-governance
    container_name: sentinelai-audit-governance
    networks:
      - sentinelai-network
    ports:
      - "8089:8089"
    environment:
      - NODE_ENV=development
      - PORT=8089
      - KAFKA_BROKERS=kafka:9092
      - LAKEHOUSE_ENDPOINT=http://minio-lakehouse:9000
    depends_on:
      kafka:
        condition: service_healthy
      minio-lakehouse:
        condition: service_healthy

  executive-analytics:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: executive-analytics
    container_name: sentinelai-executive-analytics
    networks:
      - sentinelai-network
    ports:
      - "8090:8090"
    environment:
      - NODE_ENV=development
      - PORT=8090

  # =========================================================================
  # 3. FRONTEND APPLICATION (Analyst Workspace)
  # =========================================================================
  analyst-workspace:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.app
      args:
        APP_NAME: analyst-workspace
    container_name: sentinelai-analyst-workspace
    networks:
      - sentinelai-network
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_PUBLIC_API_GATEWAY_URL=http://localhost:8080
    depends_on:
      - ingestion-collector
      - copilot-service
